# Pubblicazione automatica del sito Formazione ASTRA – © 2026 dr. Jonathan D'Eugenio
# A ogni modifica del ramo «sorgenti» (cartella autore, area autore del sito) rigenera le pagine e pubblica il ramo «main» (GitHub Pages).
name: Pubblica sito
on:
  push:
    branches: [sorgenti]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pubblica-sito
  cancel-in-progress: false
jobs:
  pubblica:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { ref: sorgenti, path: sito }
      - uses: actions/checkout@v5
        with: { ref: main, path: out }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Installa il motore di generazione (usa Google Chrome già presente sul server)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm i --no-save --no-audit --no-fund --prefix "$GITHUB_WORKSPACE" playwright@1.63.0
      - name: Genera le pagine
        env:
          SRC: ${{ github.workspace }}/sito
          PW_CHANNEL: chrome
        run: |
          (cd sito && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node sito/_src/build.js "$GITHUB_WORKSPACE/out"
      - name: Pubblica
        working-directory: out
        run: |
          git config user.name "ASTRA - pubblicazione automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nessuna modifica da pubblicare"; exit 0; fi
          git commit -q -m "Pubblicazione automatica (sorgenti ${GITHUB_SHA::7})"
          git push -q origin HEAD:main || { git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; }
